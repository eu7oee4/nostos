<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>nostos</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f5;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6b6b70;
      --border: rgba(0, 0, 0, 0.08);
      --user-bg: #111111;
      --user-fg: #ffffff;
      --bot-bg: #e8e8ea;
      --bot-fg: #111111;
      --danger: #b00020;
      --composer: #ffffff;
      --shadow: 0 -8px 24px rgba(0, 0, 0, 0.04);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10;
        --surface: #17171a;
        --text: #f5f5f7;
        --muted: #9a9aa0;
        --border: rgba(255, 255, 255, 0.1);
        --user-bg: #f5f5f7;
        --user-fg: #111111;
        --bot-bg: #2a2a2e;
        --bot-fg: #f5f5f7;
        --composer: #17171a;
        --shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      height: 100dvh;
      max-width: 40rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    header {
      flex: 0 0 auto;
      padding: calc(0.75rem + var(--safe-top)) 1rem 0.65rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header .meta {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    header a { color: inherit; }

    #log {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.85rem 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: rise 0.18s ease-out;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .msg .who {
      font-size: 0.7rem;
      color: var(--muted);
      margin: 0 0.35rem 0.2rem;
    }
    .msg .bubble {
      padding: 0.65rem 0.85rem;
      border-radius: 1.1rem;
      line-height: 1.45;
      font-size: 0.98rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: var(--user-fg);
      border-bottom-right-radius: 0.35rem;
    }
    .msg.assistant .bubble {
      background: var(--bot-bg);
      color: var(--bot-fg);
      border-bottom-left-radius: 0.35rem;
    }

    .composer {
      flex: 0 0 auto;
      padding: 0.65rem 0.75rem calc(0.65rem + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--composer);
      box-shadow: var(--shadow);
    }
    form {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #box {
      flex: 1;
      min-height: 2.75rem;
      max-height: 7.5rem;
      resize: none;
      padding: 0.7rem 0.85rem;
      border-radius: 1.25rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 16px; /* avoid iOS zoom */
      line-height: 1.35;
      outline: none;
    }
    #box:focus { border-color: color-mix(in srgb, var(--text) 35%, var(--border)); }
    #go {
      flex: 0 0 auto;
      height: 2.75rem;
      min-width: 2.75rem;
      padding: 0 0.95rem;
      border: 0;
      border-radius: 999px;
      background: var(--user-bg);
      color: var(--user-fg);
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #go:disabled { opacity: 0.45; cursor: default; }
    .err {
      min-height: 1.1rem;
      margin: 0.4rem 0.25rem 0;
      color: var(--danger);
      font-size: 0.82rem;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2rem 1rem;
    }

    /* header 右上角两个按钮：说话方式（纠偏的隐私出口）、开启通知（Web Push）。 */
    .bar { display: flex; align-items: flex-start; gap: 0.75rem; }
    .bar .grow { flex: 1 1 auto; min-width: 0; }
    #prefsBtn, #pushBtn {
      flex: 0 0 auto;
      margin-top: 0.1rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }
    #pushBtn[hidden] { display: none; }
    #pushBtn.on { color: var(--text); border-color: color-mix(in srgb, var(--text) 30%, var(--border)); }
    #pushHint {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.72rem;
    }
    #pushHint[hidden] { display: none; }

    .sheet[hidden] { display: none; }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet .panel {
      width: 100%;
      max-width: 40rem;
      max-height: 70dvh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 1rem 1rem 0 0;
      padding: 1rem 1rem calc(1rem + var(--safe-bottom));
      animation: rise 0.18s ease-out;
    }
    .sheet h2 { margin: 0; font-size: 0.95rem; font-weight: 650; }
    .sheet .hint { margin: 0.3rem 0 0.9rem; color: var(--muted); font-size: 0.78rem; }
    .sheet ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    .sheet li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      font-size: 0.9rem;
    }
    .sheet li .txt { flex: 1 1 auto; word-break: break-word; }
    .sheet li .id { color: var(--muted); font-size: 0.72rem; display: block; margin-top: 0.15rem; }
    .sheet li button {
      flex: 0 0 auto;
      border: 0;
      background: none;
      color: var(--danger);
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .sheet .close {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.7rem;
      border: 0;
      border-radius: 0.85rem;
      background: var(--bot-bg);
      color: var(--bot-fg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="bar">
        <div class="grow">
          <h1>nostos</h1>
          <p class="meta">最小 wake · <a href="/wakes">/wakes</a> · <a href="/memories">/memories</a> · <a href="/health">/health</a></p>
        </div>
        <button id="prefsBtn" type="button">说话方式</button>
        <button id="pushBtn" type="button" hidden>开启通知</button>
      </div>
      <p id="pushHint" hidden></p>
    </header>

    <div id="log" aria-live="polite"></div>

    <div class="composer">
      <form id="f">
        <textarea id="box" rows="1" placeholder="说点什么…" enterkeyhint="send" autocomplete="off"></textarea>
        <button id="go" type="submit">发送</button>
      </form>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="sheet" id="prefsSheet" hidden>
    <div class="panel" role="dialog" aria-label="说话方式">
      <h2>说话方式</h2>
      <p class="hint">你纠正过的说话方式，他一直照着来。记错了就删掉。</p>
      <ul id="prefsList"></ul>
      <button class="close" id="prefsClose" type="button">关闭</button>
    </div>
  </div>

  <script>
    const log = document.getElementById('log');
    const box = document.getElementById('box');
    const go = document.getElementById('go');
    const err = document.getElementById('err');
    let knownCount = 0;

    function autosize() {
      box.style.height = 'auto';
      box.style.height = Math.min(box.scrollHeight, 120) + 'px';
    }

    function addBubble(role, content) {
      const empty = log.querySelector('.empty');
      if (empty) empty.remove();

      const wrap = document.createElement('div');
      wrap.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');

      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = role === 'user' ? '你' : 'nostos';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;

      wrap.appendChild(who);
      wrap.appendChild(bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
    }

    function showEmpty() {
      log.innerHTML = '';
      const el = document.createElement('div');
      el.className = 'empty';
      el.textContent = '还没有消息。说一句，开始聊。';
      log.appendChild(el);
    }

    async function load(opts) {
      const silent = opts && opts.silent;
      const r = await fetch('/messages');
      const data = await r.json();
      const msgs = data.messages || [];
      if (silent && msgs.length === knownCount) return;
      knownCount = msgs.length;
      if (!msgs.length) {
        showEmpty();
        return;
      }
      log.innerHTML = '';
      msgs.forEach(m => addBubble(m.role, m.content));
    }

    async function send() {
      err.textContent = '';
      const content = box.value.trim();
      if (!content) return;

      box.value = '';
      autosize();
      addBubble('user', content);
      go.disabled = true;

      try {
        const r = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        const raw = await r.text();
        let data;
        try { data = JSON.parse(raw); }
        catch (_) { throw new Error(raw.slice(0, 200) || r.statusText); }
        if (!r.ok) throw new Error(data.detail || r.statusText);
        addBubble('assistant', data.message.content);
        knownCount += 2;
      } catch (ex) {
        err.textContent = String(ex.message || ex);
      } finally {
        go.disabled = false;
        box.focus();
      }
    }

    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      send();
    });

    box.addEventListener('input', autosize);
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // 说话方式：纠偏偏好只在这儿露面（对话流里模型记完不宣布）。
    const prefsSheet = document.getElementById('prefsSheet');
    const prefsList = document.getElementById('prefsList');

    async function loadPrefs() {
      prefsList.innerHTML = '';
      const r = await fetch('/prefs');
      const data = await r.json();
      const items = data.prefs || [];
      if (!items.length) {
        const li = document.createElement('li');
        li.textContent = '还没有记下任何纠正。';
        prefsList.appendChild(li);
        return;
      }
      items.forEach(p => {
        const li = document.createElement('li');

        const txt = document.createElement('div');
        txt.className = 'txt';
        txt.textContent = p.text;
        const id = document.createElement('span');
        id.className = 'id';
        id.textContent = p.id;
        txt.appendChild(id);

        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '删除';
        del.addEventListener('click', async () => {
          del.disabled = true;
          try {
            await fetch('/prefs/' + encodeURIComponent(p.id), { method: 'DELETE' });
            await loadPrefs();
          } catch (ex) {
            del.disabled = false;
          }
        });

        li.appendChild(txt);
        li.appendChild(del);
        prefsList.appendChild(li);
      });
    }

    document.getElementById('prefsBtn').addEventListener('click', () => {
      prefsSheet.hidden = false;
      loadPrefs().catch(e => { err.textContent = String(e); });
    });
    document.getElementById('prefsClose').addEventListener('click', () => {
      prefsSheet.hidden = true;
    });
    prefsSheet.addEventListener('click', (e) => {
      if (e.target === prefsSheet) prefsSheet.hidden = true;
    });

    // --- Web Push --------------------------------------------------------
    // 「它主动来」（PLAN §1 假设 2）在这儿落地：不订阅的话，wake 只写进站内
    // messages 表，用户不打开这一页就永远看不见。
    const pushBtn = document.getElementById('pushBtn');
    const pushHint = document.getElementById('pushHint');

    const pushSupported = 'serviceWorker' in navigator
      && 'PushManager' in window
      && 'Notification' in window;
    // iOS 只在 standalone PWA 下给 Web Push，Safari 标签页里 subscribe() 拿不到东西
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    function hint(text) {
      pushHint.textContent = text || '';
      pushHint.hidden = !text;
    }

    function b64ToU8(b64) {
      const pad = '='.repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    async function currentSub() {
      const reg = await navigator.serviceWorker.getRegistration();
      return reg ? await reg.pushManager.getSubscription() : null;
    }

    function paint(on) {
      pushBtn.hidden = false;
      pushBtn.classList.toggle('on', on);
      pushBtn.textContent = on ? '通知已开' : '开启通知';
    }

    async function enablePush() {
      pushBtn.disabled = true;
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;

        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          hint(perm === 'denied'
            ? '通知被拒了。要开的话得去系统设置里把这个站点的通知打开。'
            : '没授权，通知开不了。');
          return;
        }

        const { public_key } = await (await fetch('/push/vapid')).json();
        const opts = {
          userVisibleOnly: true,
          applicationServerKey: b64ToU8(public_key),
        };
        let sub;
        try {
          sub = await reg.pushManager.subscribe(opts);
        } catch (ex) {
          // 这台设备上已有一个用**别的** VAPID 公钥订的（换过密钥、或同一 origin
          // 上跑过别的东西）→ 浏览器拒绝换 key。退订旧的再来一次。
          if (ex && ex.name === 'InvalidStateError') {
            const old = await reg.pushManager.getSubscription();
            if (old) await old.unsubscribe();
            sub = await reg.pushManager.subscribe(opts);
          } else {
            throw ex;
          }
        }
        const r = await fetch('/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub),
        });
        if (!r.ok) throw new Error('上报失败 ' + r.status);
        paint(true);
        hint('他到点会自己来找你，这台设备上会响。');
      } catch (ex) {
        hint('开不了：' + (ex && ex.message ? ex.message : ex));
      } finally {
        pushBtn.disabled = false;
      }
    }

    async function disablePush() {
      pushBtn.disabled = true;
      try {
        const sub = await currentSub();
        if (sub) {
          await fetch('/push/subscribe?endpoint=' + encodeURIComponent(sub.endpoint),
                      { method: 'DELETE' });
          await sub.unsubscribe();
        }
        paint(false);
        hint('这台设备不再收通知了。');
      } finally {
        pushBtn.disabled = false;
      }
    }

    async function initPush() {
      if (!pushSupported) return;                  // 不支持就整个按钮不出现
      if (!window.isSecureContext) {
        // HTTPS 是硬前提：SW 在非安全上下文根本注册不起来
        pushBtn.hidden = false;
        pushBtn.disabled = true;
        pushBtn.textContent = '通知不可用';
        hint('通知需要 HTTPS。见 README「手机怎么连」。');
        return;
      }
      if (isIOS && !isStandalone) {
        pushBtn.hidden = false;
        pushBtn.disabled = true;
        pushBtn.textContent = '开启通知';
        hint('先用分享按钮「添加到主屏幕」，再从主屏图标打开——iOS 只在那种模式下才给通知。');
        return;
      }
      paint(!!(await currentSub()));
    }

    pushBtn.addEventListener('click', () => {
      if (pushBtn.classList.contains('on')) disablePush();
      else enablePush();
    });
    initPush().catch(() => {});

    load().catch(e => { err.textContent = String(e); });
    setInterval(() => {
      if (document.hidden) return;
      load({ silent: true }).catch(() => {});
    }, 8000);
    box.focus();
  </script>
</body>
</html>
